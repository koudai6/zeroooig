/* —— 对方的互动：点赞 / 评论 / 回复 / 主动发动态 —— */
function schedMom(ct,o){const c=ct.cfg;o.due=Date.now()+(c.momMin+Math.random()*Math.max(0,c.momMax-c.momMin))*1000;ct.momPending.push(o);save()}
function genComment(ct){
  const T=poolOf(ct,c=>c.type==='text'&&c.content.length<=40),E=poolOf(ct,c=>c.type==='emoji');
  if(!T.length)return null;
  let t=pickR(T).content.trim();
  if(E.length&&Math.random()<.25)t+=pickR(E).content;
  return t;
}
function genMomPost(ct){
  const T=poolOf(ct,c=>c.type==='text'),I=poolOf(ct,c=>c.type==='image');
  if(!T.length&&!I.length)return null;
  let text='';
  if(T.length){const n=1+Math.floor(Math.random()*2);text=[...T].sort(()=>Math.random()-.5).slice(0,n).map(c=>c.content.trim()).join('\n')}
  const imgs=(I.length&&(!T.length||Math.random()<.3))?[pickR(I).content]:[];
  return {id:Date.now()+Math.random(),mine:false,t:Date.now(),text,imgs,likes:[],comments:[]};
}
function momEvent(ct,txt){
  const open=view==='mom'&&G.cur===ct.id;
  if(!open)ct.momUnread=(ct.momUnread||0)+1;
  notify(ct.profile.name,txt);
  if(open)renderMom();
  refreshBadges();save();
}
function runMom(ct,pd){
  const cfg=ct.cfg,p=ct.moments.find(x=>x.id===pd.post);if(!p)return;
  if(pd.type==='react'){
    if(Math.random()*100<cfg.momLikeProb&&!p.likes.includes('them')){p.likes.push('them');momEvent(ct,'赞了你的动态')}
    if(Math.random()*100<cfg.momCommentProb){const t=genComment(ct);if(t){p.comments.push({id:Date.now()+Math.random(),by:'them',to:null,text:t,t:Date.now()});momEvent(ct,'评论了你的动态：'+t)}}
  }else if(pd.type==='reply'){
    const c=p.comments.find(x=>x.id===pd.cid);if(!c)return;
    if(Math.random()*100<cfg.momReplyProb){const t=genComment(ct);if(t){p.comments.push({id:Date.now()+Math.random(),by:'them',to:'me',text:t,t:Date.now()});momEvent(ct,'回复了你的评论：'+t)}}
  }
}
function checkMoments(){
  const now=Date.now(),today=new Date().toDateString();
  G.contacts.forEach(ct=>{
    const due=ct.momPending.filter(p=>p.due<=now);
    if(due.length){ct.momPending=ct.momPending.filter(p=>p.due>now);due.forEach(p=>runMom(ct,p));save()}
    const cap=ct.cfg.momDaily;
    if(!ct.momDay||ct.momDay.day!==today)ct.momDay={day:today,count:0};
    if(!ct.momPlan||ct.momPlan.day!==today){
      const left=Math.max(0,cap-ct.momDay.count),n=cap>0?Math.min(left,1+Math.floor(Math.random()*cap)):0,times=[];
      const a=Math.max(now+300000,new Date().setHours(9,0,0,0)),b=new Date().setHours(22,59,0,0);
      if(a<b)for(let i=0;i<n;i++)times.push(a+Math.random()*(b-a));
      ct.momPlan={day:today,times:times.sort((x,y)=>x-y)};save();
    }
    const ready=ct.momPlan.times.filter(t=>t<=now);
    if(ready.length){
      ct.momPlan.times=ct.momPlan.times.filter(t=>t>now);
      ready.forEach(()=>{if(ct.momDay.count>=cap)return;const p=genMomPost(ct);if(p){ct.momDay.count++;ct.moments.push(p);momEvent(ct,'发了一条动态')}});
      save();
    }
  });
}
setInterval(checkMoments,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&booted)checkMoments()});

/* 启动：先读存档，再显示 */
(async()=>{
  await kv.open();
  const d=await kv.get('state');
  let lite=null;try{lite=JSON.parse(localStorage.getItem('zk4_lite')||'null')}catch(e){}
  if(d){
    if(Array.isArray(d.cards))G.cards=d.cards;
    if(Array.isArray(d.groups)&&d.groups.length)G.groups=d.groups;
    if(Array.isArray(d.contacts))G.contacts=d.contacts;
    if(d.skin)G.skin={...G.skin,...d.skin};
    if(Array.isArray(d.skins))G.skins=d.skins;
    if(Array.isArray(d.polls))G.polls=d.polls;
    if(d.sys)G.sys={...G.sys,...d.sys};
  }
  if(lite&&Array.isArray(lite.contacts))lite.contacts.forEach(lc=>{const ct=ctOf(lc.id);if(ct){{const {avatar,myAvatar,bg,callBg,momCover,...lp}=lc.profile||{};ct.profile={...ct.profile,...lp}}ct.cfg={...ct.cfg,...lc.cfg};if(lc.sel)ct.sel=lc.sel}});
  G.contacts.forEach(ct=>{
    ct.cfg={...DEF_CFG,...(ct.cfg||{})};
    ct.profile={name:'联系人',avatar:'',myAvatar:'',bg:'',myName:'我',...(ct.profile||{})};
    ct.msgs=ct.msgs||[];ct.status=ct.status||{text:'',at:0};ct.sel=ct.sel||G.groups.map(g=>g.id);ct.unread=ct.unread||0;
    ct.letters=ct.letters||[];ct.moments=ct.moments||[];ct.momPending=ct.momPending||[];ct.momUnread=ct.momUnread||0;ct.momPlan=ct.momPlan||null;ct.momDay=ct.momDay||{day:'',count:0};ct.letterSeq=ct.letterSeq||1;ct.pending=ct.pending||[];ct.plan=ct.plan||null;ct.dayCount=ct.dayCount||{day:'',count:0};
  });
  G.cardSeq=Math.max(0,...G.cards.map(c=>Number(c.id)||0))+1;
  if(!G.contacts.length)newContact('对方','');
  G.cur=G.contacts[0].id;booted=true;applySkin();flush();view='chat';openChat(G.cur);
  G.contacts.forEach(ct=>ct.msgs.forEach(m=>{
    if(m.mine&&m.status==='pending'&&!m.ignored&&(m.type==='transfer'||m.type==='redpacket'))payRespond(m,ct);
    if(m.type==='poll'&&m.status==='pending')schedulePoll(m,ct);
  }));
  tickStatus();checkLetters();checkMoments();
  if(G.sys.keepAlive){toast('点一下屏幕恢复后台保活');document.addEventListener('pointerdown',()=>{startKeep()},{once:true,capture:true})}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
